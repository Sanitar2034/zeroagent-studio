name: Labeler

# Auto-labels PRs based on changed paths.
# pull_request_target is required so fork PRs can receive labels.
# https://github.com/actions/labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout default branch config
        uses: actions/checkout@v7

      - name: Apply path-based labels
        uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
