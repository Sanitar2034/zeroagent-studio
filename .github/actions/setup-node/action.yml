name: Setup Node.js toolchain
description: Node 22 + npm ci from package-lock.json (setup-node@v6, npm cache).

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies (clean, reproducible)
      shell: bash
      run: npm ci --no-audit --no-fund
